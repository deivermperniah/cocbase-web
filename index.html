<!doctype html>
<html lang="es" class="dark">

    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/lilita-one-latin.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="preload" as="image" href="/pwa-192x192.png" />
    <style>
      body {
        margin: 0;
        background: #0a0a0a;
      }
      .app-splash {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-splash img {
        width: 64px;
        height: 64px;
        animation: app-splash-pulse 1.2s ease-in-out infinite;
      }
      @keyframes app-splash-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(0.94);
        }
      }
      html[data-session] #app:not([data-v-app]):not(:has(.app-splash)) {
        min-height: 100dvh;
        background: url(/pwa-192x192.png) center / 64px no-repeat;
      }
      html[data-session] #app:not([data-v-app]) > :not(.app-splash) {
        visibility: hidden;
      }
    </style>
    <script>
      try {
        if (
          Object.keys(localStorage).some(function (k) {
            return /^sb-.+-auth-token$/.test(k);
          })
        )
          document.documentElement.setAttribute("data-session", "");
      } catch (e) {}
    </script>
    <title>Bases de Clash of Clans por ayuntamiento · cocbase</title>
    <meta
